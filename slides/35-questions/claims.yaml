slide: 35
title: 'Questions?'
section: 04 · Stop worrying
claims:
- id: c1
  text: 'MESA is supported by the U.S. National Science Foundation under Award OAC-2632685 · [NAIRR]'
  kind: factual
  priority: high
  status: partially-supported
  validation: Fill in the remaining awards; check every number with the NSF Award Search API.
  sources:
  - https://api.nsf.gov/services/v1/awards/2632685.json
  - https://api.nsf.gov/services/v1/awards.json?keyword=AIIRA
  - https://idss-mesa.github.io/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/awards.json
  - data/processed/quote_checks.json
  notes: >-
    Text updated 2026-10-31 to the current slide line (earlier version also listed "[other OAC / DBI
    awards]"; no other OAC or DBI award for MESA was found). NSF Award API (re-fetched 2026-10-31):
    2632685 is a $4,617,408 cooperative agreement to the University of New Mexico (PI Tyson L Swetnam),
    07/15/2026-05/31/2029, managed by CISE / Office of Advanced Cyberinfrastructure, so "OAC-2632685" is
    consistent. Its NSF funding program is "NAIRR-Nat AI Research Resource". The [NAIRR] placeholder is
    ambiguous: it may mean that funding program (already covered by this award), or a NAIRR Pilot compute
    allocation, which the MESA site lists separately under compute ("ACCESS-CI & NAIRR ... NAIRR Pilot
    allocations"). No public record of a specific NAIRR Pilot allocation to MESA was checked. Speaker
    should decide which is meant. An earlier award with the same title, 2608717 to the University of
    Arizona (06/01/2026-08/31/2026, inactive), appears to be the pre-transfer version; no need to list
    it. Partially supported only because the [NAIRR] placeholder is still unresolved.
  proposed_text: 'MESA is supported by the U.S. National Science Foundation under Award OAC-2632685 (NAIRR program). If [NAIRR] was meant to credit compute, add instead: "Compute via NAIRR Pilot allocation [allocation ID]".'
