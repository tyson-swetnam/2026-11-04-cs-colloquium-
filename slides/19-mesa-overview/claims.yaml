slide: 19
title: 'Thawing the frozen data lake of public research'
section: 03 · Build your AI
claims:
- id: c1
  text: 'Notes: MESA connects scientific data through curated, indexed metadata, runs on national research infrastructure today, open source'
  kind: factual
  priority: medium
  status: partially-supported
  validation: Link the repositories and their licenses; name the deployment sites.
  sources:
  - https://idss-mesa.github.io/
  - https://idss-mesa.github.io/stack.html
  - https://idss-mesa.github.io/portal.html
  - https://mesa.cyverse.org/
  - https://idss-mesa.github.io/docs/llms-full.txt
  - https://api.nsf.gov/services/v1/awards/2632685.json
  - https://api.nsf.gov/services/v1/awards/1743442.json
  - https://api.nsf.gov/services/v1/awards/2608717.json
  evidence:
  - data/raw/research/facts.csv
  - data/processed/award_2632685.json
  - data/processed/award_1743442.json
  - data/processed/award_2608717.json
  - data/processed/mesa_awards_search.json
  - src/01_nsf_award.py
  - src/02_predecessor_award.py
  notes: >-
    The notes sentence is the project's own (developer-reported) description on idss-mesa.github.io, nearly
    verbatim. Running today: publicly evidenced only on CyVerse (the MESA Portal at mesa.cyverse.org answered
    on 2026-10-31; CyVerse hosts the Formation MCP server and the public Data Store connector). The NSF award
    abstract lists TACC, Open Storage Network, Jetstream-2 and RENCI iRODS as where MESA "will operate", and
    the UNM award started 2026-07-15; no public page shows a MESA service running at TACC or on Jetstream2.
    Timeline: the NSF Award API also lists award 2608717 at the University of Arizona with the same title, PI
    (Swetnam), program and $4,617,408 estimate, dated 2026-06-01 to 2026-08-31 with FY 2026 obligations of
    $0.00. This looks like the award starting at Arizona on 2026-06-01 and moving to UNM as 2632685 on
    2026-07-15 (an inference from the two records; NSF does not state a transfer). Either way, MESA funding is
    under five months old at the talk. What runs today: the MESA Portal is hosted on CyVerse; the MESA MCP
    servers (mesa-mcp, mesa-ducklake, irods-mcp-server) are cloned, built and run on the user's own machine by
    the installer, and connect to CyVerse-hosted services (Formation, CyVerse's own Discovery Environment MCP
    server, and the public Data Store connector). CyVerse as national infrastructure: CyVerse's older NSF award
    1743442 ended 2025-07-31, so the current evidence is the 2026 MESA award abstract, which lists CyVerse
    among "public NSF cyberinfrastructure accessed through ACCESS-CI" (f4).
    Open source: the site and award call it open source, and code is published at github.com/idss-mesa
    (mesa-mcp, mesa-ducklake, irods-mcp-server; one-line public installer). Licence types are not named in
    the public docs (the changelog only mentions a LICENSE file with copyright held by the UNM Regents), and
    repository licence files were out of scope here, so the licences remain unverified. The "metadata"
    claim is a design description, supported as a stated goal by the award abstract.
  proposed_text: 'MESA connects scientific data through curated, indexed metadata. Its portal runs on CyVerse today, and its MCP tools install in one line and connect to CyVerse-hosted services; TACC, Jetstream2 and OSN are planned. Code is public at github.com/idss-mesa.'
- id: c2
  text: 'Figure: MESA proposal · NSF Award #2632685'
  kind: factual
  priority: low
  status: supported
  validation: Same award check as slide 21.
  sources:
  - https://api.nsf.gov/services/v1/awards/2632685.json
  - https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2632685
  evidence:
  - data/raw/research/facts.csv
  - data/processed/award_2632685.json
  - src/01_nsf_award.py
  notes: >-
    NSF award 2632685 is "Research Infrastructure: Category II: MESA (Multidisciplinary Environment for
    Scientific Advancement)", University of New Mexico, PI Tyson L Swetnam, OAC/CISE, cooperative agreement,
    2026-07-15 to 2029-05-31, $4,617,408, fund program NAIRR. That the figure itself comes from the proposal
    cannot be checked from public sources (proposals are not public); it is the speaker's own material.
    Program: the NSF record's program element is "Artificial Intelligence (AI)" (296Y00, reference code 075Z)
    and the fund program is NAIRR. The record names no IDSS program or program element; the abstract only
    describes MESA as operating "as an integrated data system and service". The IDSS label (used on the MESA
    site footer and in slide-20 notes) is developer-reported only. The same award first appears as 2608717 at
    the University of Arizona (2026-06-01 to 2026-08-31, same title, PI and amount), also under program
    "Artificial Intelligence (AI)" and fund program NAIRR.
