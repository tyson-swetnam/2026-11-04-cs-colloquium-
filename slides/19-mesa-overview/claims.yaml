- id: c4
  text: 'Notes placeholder: the disciplines MESA serves (right-hand column of the figure)'
  kind: factual
  priority: low
  status: partially-supported
  validation: Take the disciplines and partner communities from the NSF award abstract.
  sources:
  - https://api.nsf.gov/services/v1/awards/2632685.json
  evidence:
  - data/raw/research/facts.csv
  - data/processed/award_2632685.json
  notes: >-
    This is a placeholder for the speaker, not a factual assertion. The figure was not available to check,
    so whether its right-hand column matches the award was not verified. The award abstract says MESA "will
    enable" researchers in "astronomy, biology, environment, public health, and computer science" (planned,
    not current). Partners: ESIIL (environmental data science), NCEMS (molecular and cellular science),
    AIIRA (AI in agriculture) and the Event Horizon Telescope. Agriculture appears only through AIIRA and the
    "precision agriculture" prototype, and multi-omics only as a prototype, not as named disciplines. Slide
    20 also lists NEON (Battelle) and NSCORE as early adopters; those two are not in the award abstract.
    The speaker should fill this in from the figure.
  proposed_text: 'Disciplines named in the award: astronomy, biology, environment, public health and computer science. Partners: ESIIL (environmental data science), NCEMS (molecular and cellular science), AIIRA (AI in agriculture) and the Event Horizon Telescope.'
