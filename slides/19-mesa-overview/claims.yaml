- id: c4
  text: 'Notes placeholder: the disciplines MESA serves (right-hand column of the figure)'
  kind: factual
  priority: low
  status: supported
  validation: Take the disciplines and partner communities from the NSF award abstract.
  sources:
  - https://api.nsf.gov/services/v1/awards/2632685.json
  evidence:
  - data/raw/research/facts.csv
  - data/processed/award_2632685.json
  notes: >-
    The figure was not available to check. The award abstract names astronomy, biology, environment, public
    health and computer science, with partners ESIIL (environmental data science), NCEMS (molecular and
    cellular science), AIIRA (AI in agriculture) and the Event Horizon Telescope. Slide 20 also lists NEON
    (Battelle) and NSCORE as early adopters; those two are not in the award abstract.
  proposed_text: 'Disciplines: astronomy (EHT), biology and multi-omics (NCEMS), environment (ESIIL), agriculture (AIIRA), public health and computer science.'
