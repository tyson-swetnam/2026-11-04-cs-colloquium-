slide: 30
title: 'Already running on real collections'
section: 03 · Build your AI
claims:
- id: c1
  text: "MESA's MCP servers pointed at data collections (notes: the NCEMS data on CyVerse, this summer)"
  kind: factual
  priority: medium
  status: partially-supported
  validation: Link the collection paths and the server configuration.
  sources:
  - https://api.nsf.gov/services/v1/awards/2632685.json
  - https://api.nsf.gov/services/v1/awards/2335029.json
  - https://cyverse.org/news/key-role-cyverse-nsfs-newest-synthesis-center
  - https://idss-mesa.github.io/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/check_summary.json
  - src/01_check.py
  notes: >-
    The setting checks out: the MESA award names NCEMS as a partner the project "will be developed and tested
    with", NCEMS's own NSF award (2335029, Penn State) says its cyberinfrastructure is provided by CyVerse,
    and the MESA site says the MCP stack is "in use against the CyVerse Data Store today" (developer-reported).
    The pilot itself is not publicly documented: across the MESA public site and docs, NCEMS appears only
    once (as an "anchor science community" on the hiring page), with no pilot page, collection path or
    configuration. ncems.cyverse.org reset the connection, and the anonymous Data Store WebDAV path
    redirected to a CyVerse "Unblock Me" page, which was not pursued. MESA's award started 2026-07-15, so
    "this summer" is plausible but rests on the speaker's account. The speaker should link the collection
    path(s) and the server config, or say "pilot run by the MESA team" in the notes.
  proposed_text: "MESA's MCP servers pointed at NCEMS collections on the CyVerse Data Store (summer 2026 pilot)"
- id: c2
  text: Existing metadata read, terms resolved through OLS and OBO, written back as iRODS attributes
  kind: technical
  priority: medium
  status: partially-supported
  validation: Before/after AVU counts for the collection; sample of resolved terms.
  sources:
  - https://idss-mesa.github.io/docs/servers/mesa-mcp/
  - https://idss-mesa.github.io/docs/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/check_summary.json
  notes: >-
    The capability is documented (developer docs, page generated by an AI agent): mesa-mcp has mesa_ols_*
    tools to "Browse OBO/OLS ontologies" and mesa_avu_* tools to "Apply ontology terms and DataCite fields as
    AVUs (with the CURIE in the `unit` slot)". Writing AVUs needs a signed-in CyVerse user (anonymous access is
    read-only). No public before/after AVU counts or sample of resolved terms for the NCEMS collections exists,
    so the pilot outcome is speaker-reported. Wording: OLS is EBI's lookup service and OBO the ontologies, so
    "through OLS and OBO" reads as two services; the proposed text is more exact. Code not checked.
  proposed_text: 'Existing metadata read, terms matched to OBO ontologies via EBI OLS, written back as iRODS AVUs'
- id: c3
  text: Every write recorded in DuckLake; the session left behind as an OKF bundle
  kind: technical
  priority: medium
  status: partially-supported
  validation: Commit (or link) the DuckLake catalog snapshot and the bundle; define OKF on the slide or in the notes.
  sources:
  - https://idss-mesa.github.io/docs/servers/mesa-ducklake/
  - https://idss-mesa.github.io/okf/index.md
  - https://idss-mesa.github.io/docs/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/check_summary.json
  notes: >-
    DuckLake part: the mesa-ducklake docs say "Every AVU write through `mesa-mcp` is mirrored here as a change
    record with provenance", but the configuration docs say a blank MESA_MCP_DUCKLAKE__CATALOG_DSN "disables
    history", so "every write" holds only if the pilot set a catalog (developer docs; not checked in code).
    OKF part: OKF is the Open Knowledge Format (v0.2, Google Cloud knowledge-catalog spec). MESA's public docs
    use it for the documentation site itself; they do not describe exporting an agent session as an OKF
    bundle, and no NCEMS session bundle or DuckLake snapshot is public. Spell out OKF on the slide or in the
    notes, and link the bundle if possible.
  proposed_text: 'Every metadata write logged in DuckLake; the session saved as an Open Knowledge Format (OKF) bundle'
- id: c4
  text: 'Notes: nothing copied and nothing new to operate'
  kind: technical
  priority: low
  status: partially-supported
  validation: MESA docs on where mesa-mcp and the DuckLake history run and are stored.
  sources:
  - https://idss-mesa.github.io/docs/servers/mesa-ducklake/
  - https://idss-mesa.github.io/docs/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  notes: >-
    Design supports "nothing copied": mesa-mcp works on iRODS in place and the DuckLake Parquet change records
    "can live at `<project>/.mesa/ducklake/` inside iRODS, so metadata travels with the data". "Nothing new to
    operate" is looser: the MCP servers run locally or in a CyVerse app, and DuckLake needs a catalog (a DuckDB
    file or Postgres). Fine as a spoken line if it means "no new server for NCEMS to run".
  proposed_text: 'Notes: nothing copied, and no new service for NCEMS to run'
- id: c5
  text: 'Notes: Everything is open source'
  kind: factual
  priority: medium
  status: partially-supported
  validation: Public visibility of the MESA repositories listed on idss-mesa.github.io.
  sources:
  - https://idss-mesa.github.io/llms-full.txt
  - https://idss-mesa.github.io/okf/concepts/mesa-forge.md
  evidence:
  - data/raw/research/facts.csv
  notes: >-
    The tools used in this pilot (mesa-mcp, mesa-ducklake, irods-mcp-server) are listed as public repositories
    at github.com/idss-mesa, but the MESA site itself marks mesa-portal and mesa-forge as private ("their
    repositories are not public"). "Everything" overreaches; licences were not checked here (see slide 19).
  proposed_text: 'Notes: The MCP servers and metadata tools are open source at github.com/idss-mesa'
- id: c6
  text: 'Slide: A storage endpoint: an iRODS zone or S3 bucket joins the mesh without moving files'
  kind: technical
  priority: medium
  status: partially-supported
  validation: MESA docs on iRODS federation and S3/OSN access.
  sources:
  - https://idss-mesa.github.io/llms-full.txt
  - https://idss-mesa.github.io/docs/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  notes: >-
    iRODS: the MESA home page describes "One policy engine across the CyVerse Data Store and its federated
    peers" (developer-reported design; iRODS zone federation is a standard iRODS feature). S3: the docs only
    show S3/OSN buckets being mounted into a workspace with osn-mount.sh; nothing public says an S3 bucket
    "joins the mesh" under the iRODS policy engine. Files do stay in place in both cases.
  proposed_text: 'A storage endpoint: a federated iRODS zone, or an S3 bucket mounted in place; no files move'
