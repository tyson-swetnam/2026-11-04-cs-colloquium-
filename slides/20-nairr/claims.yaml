- id: c13
  text: 'MESA is funded through NSF IDSS, one of three NSF programs that feed NAIRR (notes)'
  kind: factual
  priority: medium
  status: partially-supported
  validation: 'NSF NAIRR-OC announcement; IDSS award announcement.'
  sources:
  - 'https://www.nsf.gov/cise/updates/nsf-establishes-operations-center-national-artificial'
  - 'https://www.nsf.gov/news/nsf-announces-83m-investment-integrated-data-systems'
  - 'https://idss-mesa.github.io/'
  evidence:
  - data/raw/research/facts.csv
  notes: 'NSF says the NAIRR-OC "will coordinate with projects supported through three NSF programs": State and Regional AI Infrastructure Hubs, IDSS, and Unlocking Dataset Value. MESA is an IDSS award. NSF says "coordinate with", not "feed"; and the award itself is charged to the NAIRR fund line (c10).'
  proposed_text: 'MESA is funded through NSF IDSS, one of three NSF programs the NAIRR Operations Center coordinates with.'
