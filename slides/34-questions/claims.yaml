slide: 34
title: 'Questions?'
section: 04 · Stop worrying
claims:
- id: c1
  text: 'MESA is supported by NSF Award #2632685 · [NAIRR] · [other OAC / DBI awards]'
  kind: factual
  priority: high
  status: partially-supported
  validation: Fill in the remaining awards; check every number with the NSF Award Search API.
  sources:
  - https://api.nsf.gov/services/v1/awards/2632685.json
  - https://api.nsf.gov/services/v1/awards.json?keyword=AIIRA
  - https://idss-mesa.github.io/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/awards.json
  - data/processed/quote_checks.json
  notes: >-
    Deck now reads "under Award OAC-2632685 · [NAIRR]". NSF Award API: 2632685 is a $4,617,408
    cooperative agreement to the University of New Mexico (PI Tyson L Swetnam), 07/15/2026-05/31/2029,
    managed by CISE / Office of Advanced Cyberinfrastructure, so "OAC-2632685" is consistent. Its
    funding program is "NAIRR-Nat AI Research Resource", which resolves the [NAIRR] placeholder: the
    NAIRR money is this same award, not a separate award. No other OAC or DBI award for MESA was found.
    An earlier award with the same title, 2608717 to the University of Arizona (06/01/2026-08/31/2026,
    inactive), appears to be the pre-transfer version; no need to list it. The MESA site calls the
    program "Integrated Data Systems & Services"; the NSF record title says "Research Infrastructure:
    Category II". Partially supported only because the placeholders are still on the slide.
  proposed_text: 'MESA is supported by the U.S. National Science Foundation under Award OAC-2632685 (NAIRR program).'
