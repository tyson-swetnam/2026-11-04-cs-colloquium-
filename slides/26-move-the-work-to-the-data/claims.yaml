- id: c7
  text: 'NEON pitfall traps, DP1.10022.001: 47 sites, 2013-2026'
  kind: quantitative
  priority: high
  status: supported
  validation: 'NEON Data API product record.'
  sources:
  - https://data.neonscience.org/api/v0/products/DP1.10022.001
  evidence:
  - data/raw/research/facts.csv
  - data/processed/checks.json
  - src/01_check.py
  notes: 'NEON Data API (2026-10-31): DP1.10022.001 "Ground beetles sampled from pitfall traps", ACTIVE, 47 sites, months 2013-07 to 2026-10 (2026-10 is partial, 5 sites; latest release RELEASE-2026, newer months provisional).'
- id: c8
  text: 'NEON Biorepository: 188,522 specimen records, most also on GBIF; 53,257 beetle images from four sources'
  kind: quantitative
  priority: medium
  status: partially-supported
  validation: 'Biorepository portal and GBIF dataset counts.'
  sources:
  - https://biorepo.neonscience.org/portal/api/v2/occurrence/search?collid=39&limit=1
  - https://api.gbif.org/v1/dataset/search?q=NEON%20Biorepository%20carabid
  - https://biorepo.neonscience.org/portal/api/v2/collection/63
  - https://biorepo.neonscience.org/portal/api/v2/collection/4
  evidence:
  - data/raw/research/facts.csv
  - data/processed/checks.json
  - data/processed/bycatch.json
  - src/01_check.py
  - src/02_bycatch.py
  notes: 'Biorepository portal API: the 11 collections fed by ground-beetle pitfall sampling sum to exactly 188,522 records, and the 11 matching GBIF datasets sum to exactly 145,263 (77%), as in the notes. These are records, not distinct beetle specimens. Of the 188,522, 47,459 are not carabid: the five bycatch-named invertebrate, herptile and mammal collections (46,832) plus 627 invertebrate vouchers sorted from bycatch (collid 4). (An earlier note said 47,832; that was an arithmetic error, corrected 2026-10-31 with src/02_bycatch.py.) The 141,063 carabid records include 20,945 DNA extracts taken from pinned vouchers already counted in collid 39, and lots pooled across traps (archive pooling) or kept per trap (trap sorting). The 53,257 images from four sources is a project figure; the public report was not reachable (see c11) and the project repository was not read, so that part is unverified.'
  proposed_text: 'NEON Biorepository: 188,522 records (specimens, lots and DNA extracts) in 11 collections, 77% also on GBIF'
- id: c9
  text: 'Resolve -> stage (one 16 GB GPU) -> validate (Carabidae NCBITaxon:41073; mm UO:0000016) -> record in DuckLake'
  kind: technical
  priority: medium
  status: partially-supported
  validation: 'neon-beetle-seg repository and run logs.'
  sources:
  - https://www.ebi.ac.uk/ols4/api/ontologies/ncbitaxon/terms?obo_id=NCBITaxon:41073
  - https://www.ebi.ac.uk/ols4/api/ontologies/uo/terms?obo_id=UO:0000016
  evidence:
  - data/raw/research/facts.csv
  - data/processed/checks.json
  notes: 'Both CURIEs resolve in OLS4 and are not obsolete: NCBITaxon:41073 = Carabidae, UO:0000016 = millimeter. The single 16 GB GPU and the DuckLake recording are project details that could only be checked in the neon-beetle-seg repository or run logs, which were not read (tool rules); left unchecked.'
- id: c10
  text: '65,830 beetles segmented into head, pronotum and elytra, measured in mm; elytra length tracks human measurements, r = 0.98'
  kind: quantitative
  priority: high
  status: unverified
  validation: 'Project outputs (DuckLake tables, report).'
  sources:
  - https://data.cyverse.org/dav-anon/iplant/home/tswetnam/neon-beetle-seg/report/report.html
  evidence: []
  notes: 'Developer-reported project result. The public report URL returned HTTP 307 to unblockme.cyverse.org (a CyVerse block page) for an anonymous request on 2026-10-31; not bypassed. Check from the report or DuckLake tables before the talk, and say it as the project''s own result.'
- id: c11
  text: 'Outputs on the CyVerse Data Store: DuckLake lakehouse, Parquet and a public report'
  kind: factual
  priority: low
  status: unverified
  validation: 'Public paths/URLs.'
  sources:
  - https://data.cyverse.org/dav-anon/iplant/home/tswetnam/neon-beetle-seg/
  evidence: []
  notes: 'Both the report URL and the folder URL redirected (HTTP 307) to https://unblockme.cyverse.org/ from this environment, so public access could not be confirmed here. Open the report link from an ordinary network before the talk.'
