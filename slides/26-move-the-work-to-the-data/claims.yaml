- id: c13
  text: 'Notes: DP1.10022.001 covers 47 sites in 20 domains, July 2013 to September 2026'
  kind: quantitative
  priority: low
  status: partially-supported
  validation: 'NEON Data API product record joined to /sites.'
  sources:
  - https://data.neonscience.org/api/v0/products/DP1.10022.001
  - https://data.neonscience.org/api/v0/sites
  evidence:
  - data/raw/research/facts.csv
  - data/processed/checks.json
  - src/01_check.py
  notes: '47 sites in 20 domains and a July 2013 start are confirmed. The domain count is computed (src/01_check.py joins the product siteCodes to /sites domainCode; checks.json neon.n_domains = 20), not quoted from a document. The API now lists October 2026 for 5 sites, so "to September 2026" is a little out of date (likely the date the project pulled the data).'
  proposed_text: '47 sites, 20 domains, July 2013 to October 2026 (latest months provisional)'
- id: c14
  text: 'Notes: 145,906 pinned individuals of 826 taxa'
  kind: quantitative
  priority: low
  status: unverified
  validation: 'Download DP1.10022.001 tables (neonUtilities / data API) and count pinned individuals and distinct taxa.'
  sources: []
  evidence: []
  notes: 'Not computed: needs the full per-site, per-month data download. The portal''s pinned-voucher collection holds 98,168 records (c8), so 145,906 presumably comes from NEON''s own pinning tables; say where the number comes from.'
- id: c15
  text: 'Notes: most NEON pitfall specimens never photographed; only 20,698 segmented beetles link to a NEON site; elytra length reads about 8% long'
  kind: quantitative
  priority: medium
  status: unverified
  validation: 'Project outputs (report, DuckLake tables).'
  sources: []
  evidence: []
  notes: 'Project figures; report unreachable (c11) and repository not read. The GBIF image count (5,961 of 145,263 records with a still image) does not test "never photographed": it shows only which images were published to GBIF, its denominator includes DNA extracts and non-beetle bycatch, and the project itself reports 53,257 beetle images from four sources. Treat the whole line as the project''s own statement.'
