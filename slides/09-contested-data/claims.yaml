  text: 'Notes: Bartz final approval July 20, 2026, the largest US copyright settlement'
  kind: attribution
  priority: low
  status: supported
  validation: 'Date from the final approval order (Dkt. 680) and settlement website; "largest" in the order, which quotes the court''s preliminary-approval opinion, and in the court-authorized Long Form Notice and settlement website.'
  sources:
  - https://publishers.org/wp-content/uploads/2026/07/Order-Granting-Final-Approval-of-Settlement171.pdf
  - https://www.anthropiccopyrightsettlement.com/
  - https://assets-us-01.kc-usercontent.com:443/1eeb16db-4934-006e-40a6-38fa91285ebb/ce109a57-390c-4d76-ad65-5807d4830fe5/ANT%20-%20Long-Form%20Notice_Updated%20Deadline%201.8.2026.pdf
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  notes: "Date is right (Judge Martínez-Olguín). Corrected after review: the court itself calls it 'the largest copyright class action settlement in history' (final approval order, quoting Bartz, 2025 WL 2961371, at *3), and the official notice and settlement website say the same. The earlier note that only counsel and press say so was wrong. The official wording is 'copyright class action settlement', slightly narrower than the notes' 'US copyright settlement'."
  proposed_text: 'final approval July 20, 2026; the court calls it the largest copyright class action settlement in history'
