- id: c9
  text: 'Notes: Getty v. Stability in the UK held model weights are not infringing copies'
  kind: factual
  priority: low
  status: supported
  validation: 'Judgment [2025] EWHC 2863 (Ch), 4 Nov. 2025, from The National Archives Find Case Law.'
  sources:
  - https://caselaw.nationalarchives.gov.uk/ewhc/ch/2025/2863
  - https://www.burges-salmon.com/articles/102lydc/getty-images-v-stability-ai-getty-granted-permission-to-appeal
