- id: c7
  text: 'Notes: Concord, UMG and ABKCO v. Anthropic seek more than $3B over alleged torrenting of about 20,000 songs'
  kind: factual
  priority: medium
  status: partially-supported
  validation: 'Complaint, Case 3:26-cv-00880 (N.D. Cal., Jan. 28, 2026), Exhibits A and B counts; separate Sony/Warner Chappell complaint 5:26-cv-09217 (Aug. 28, 2026) checked for the torrenting wording.'
  sources:
  - https://www.musicbusinessworldwide.com/files/2026/01/Anthropic-complaint-01.28.26-1.pdf
  - https://www.musicbusinessworldwide.com/files/2026/08/COMPLAINT-in-Sony_Music_Publishing_US_LLC_e.pdf
  - https://fortune.com/2026/09/01/anthropic-warner-sony-music-songs-lawsuit/
  evidence:
  - data/raw/research/facts.csv
  - data/processed/numbers.csv
  notes: "Parties, $3B+ and 'about 20,000 songs' are right for the Concord/UMG/ABKCO suit. The torrenting part is off: that complaint alleges torrented books containing 'hundreds or thousands' of works, 'including the 714 works identified in Exhibit A' (a minimum, not a cap). The 20,517 works in Exhibit B are a separate set pleaded as training and output infringement; the $3B estimate adds both (21,231). The separate Sony/Warner Chappell suit (Aug. 28, 2026) is also mainly a torrenting case, alleging 'hundreds or more' works in torrented books and 'thousands upon thousands' harvested overall, with no dollar total. Neither complaint alleges torrenting of about 20,000 songs. All are allegations; Anthropic moved to dismiss the January suit in part on Aug. 3, 2026."
  proposed_text: 'Concord, UMG and ABKCO v. Anthropic claim potential damages of more than $3B over about 21,000 songs: at least 714 allegedly in torrented songbooks, and 20,517 allegedly used in training and output. Sony and Warner Chappell filed a separate torrenting suit in Aug. 2026.'
