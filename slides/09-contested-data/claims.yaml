slide: 9
title: 'Contested data, Western defaults'
section: '01 · Fear'
claims:
- id: c1
  text: 'Bartz v. Anthropic settlement: $1.5B, about $3,100 for each of some 480,000 works'
  kind: quantitative
  priority: high
  status: supported
  validation: 'Final approval order (Dkt. 680, July 20, 2026): $1.5B fund, 482,460 works on the Works List. $1.5B / 482,460 = $3,109 per work gross (src/02_check.py).'
  sources:
  - https://publishers.org/wp-content/uploads/2026/07/Order-Granting-Final-Approval-of-Settlement171.pdf
  - https://www.anthropiccopyrightsettlement.com/
  evidence:
  - data/raw/research/facts.csv
  - data/processed/numbers.csv
  - data/processed/quote_check.csv
  notes: "$3,100 is the gross figure. The court and notice say 'approximately $3,000' per work, plus interest, less costs and fees. Net of the $101.6M fee award, expenses and cost reserve, the fund is about $2,855 per listed work, but unclaimed shares are to be redistributed, so with 440,490 works claimed it is about $3,127 per claimed work before administration costs (src/02_check.py). So the actual payment per claimed work is roughly $3,000, not capped at $2,855. Copy of the order is hosted by the Association of American Publishers (CourtListener docket pages returned 403)."
- id: c2
  text: 'In 2025, courts held training to be fair use in Bartz and in Kadrey v. Meta, but not acquiring pirated copies'
  kind: factual
  priority: high
  status: partially-supported
  validation: 'Bartz Order on Fair Use (Dkt. 231, June 23, 2025) and Kadrey SJ order (Dkt. 598, June 25, 2025), quotes checked in the PDFs.'
  sources:
  - https://storage.courtlistener.com/recap/gov.uscourts.cand.434709/gov.uscourts.cand.434709.231.0.pdf
  - https://storage.courtlistener.com/recap/gov.uscourts.cand.415175/gov.uscourts.cand.415175.598.0.pdf
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  notes: "Both courts ruled for the AI company on training, but Kadrey was narrow: Chhabria said the ruling 'does not stand for the proposition' that training is lawful, only that 'these plaintiffs made the wrong arguments'. On piracy, Alsup denied Anthropic summary judgment on the pirated library copies and set them for trial (the case then settled), so there is no final holding. Kadrey went the other way on downloading ('so too was Meta's downloading of those books' transformative), left the torrent-distribution claim open, and covers only 13 authors. Both are district-court rulings, not precedent. As worded, the slide implies both courts rejected piracy."
  proposed_text: 'In 2025, Bartz held training fair use but sent pirated library copies to trial; Kadrey v. Meta ruled for Meta on a narrow record.'
- id: c3
  text: 'Still in court: NYT v. OpenAI and Microsoft; Disney and Universal v. Midjourney; music publishers v. Anthropic, seeking more than $3B'
  kind: factual
  priority: medium
  status: partially-supported
  validation: 'NYT: S.D.N.Y. MDL order (Jan. 5, 2026) and summary-judgment briefing report (Sept. 4, 2026). Midjourney: mediation schedule set Nov. 2025 (due Aug. 19, 2026) and latest case report (May 2026). Publishers: Concord/UMG/ABKCO complaint 3:26-cv-00880 (Jan. 28, 2026), Anthropic partial motion to dismiss (Aug. 3, 2026), and the separate Sony/Warner Chappell complaint 5:26-cv-09217 (Aug. 28, 2026).'
  sources:
  - https://assets.law360news.com/2426000/2426657/https-ecf-nysd-uscourts-gov-doc1-127138822336.pdf
  - https://chatgptiseatingtheworld.com/2026/09/04/summary-judgment-briefing-starts-in-openai-mdl-litigation-before-judge-stein/
  - https://graphicpolicy.com/2025/11/14/court-suggests-disney-v-midjourney-go-to-mediation/
  - https://graphicpolicy.com/2026/05/11/disney-warner-bros-universal-and-midjourney-discovery-dispute/
  - https://www.musicbusinessworldwide.com/files/2026/01/Anthropic-complaint-01.28.26-1.pdf
  - https://www.musicbusinessworldwide.com/umg-concord-and-abkco-sue-anthropic-for-3bn-in-what-could-be-single-largest-non-class-action-copyright-case-in-us-history/
  - https://www.musicbusinessworldwide.com/files/2026/08/COMPLAINT-in-Sony_Music_Publishing_US_LLC_e.pdf
  - https://www.musicbusinessworldwide.com/now-sony-music-publishing-and-warner-chappell-sue-anthropic-in-multi-billion-dollar-lawsuit-one-of
  evidence:
  - data/raw/research/facts.csv
  - data/processed/numbers.csv
  notes: "All three appear open; no merits ruling found in any as of Oct. 31, 2026. NYT: summary-judgment motions filed Sept. 4, 2026; no ruling found. Midjourney: Warner Bros. Discovery's suit was consolidated; mediation was ordered in Nov. 2025 to finish by Aug. 19, 2026, and the latest case report found (May 2026) is a discovery dispute; mediation outcome not found and the docket could not be read (CourtListener 403). A reviewer reported later scheduling dates (fact discovery closed Sept. 2026, motions due Nov. 23, 2026); no source for these was found, so they are not used. Music publishers: there are now several suits. The '$3B' figure belongs to the Concord/UMG/ABKCO suit (Jan. 2026): the publishers' own estimate of 'potential statutory damages of more than $3 billion' (21,231 works x $150,000 = $3.18B), not an award. Sony Music Publishing and Warner Chappell filed a separate suit on Aug. 28, 2026 (5:26-cv-09217, also naming Amodei and Mann) alleging torrenting and lyric scraping; it seeks up to $150,000 per work and states no total. BMG and Round Hill have also sued (per MBW). Footer says 'as of August 2026'; re-check the day before the talk."
  proposed_text: 'Still in court: NYT v. OpenAI and Microsoft (summary judgment); Disney, Universal and Warner Bros. v. Midjourney; UMG, Concord and ABKCO v. Anthropic, claiming potential damages of more than $3B (plus a newer Sony/Warner Chappell suit).'
- id: c4
  text: 'More than half of web content is in English; models draw mostly on European and North American text'
  kind: attribution
  priority: medium
  status: partially-supported
  validation: 'W3Techs content-language survey (live page and yearly history); Common Crawl language statistics (src/02_check.py); Llama 2 paper Table 10; Dodge et al. 2021 on C4.'
  sources:
  - https://w3techs.com/technologies/overview/content_language
  - https://w3techs.com/technologies/history_overview/content_language/ms/y
  - https://commoncrawl.github.io/cc-crawl-statistics/plots/languages.csv
  - https://arxiv.org/pdf/2307.09288
  - https://arxiv.org/pdf/2104.08758
  evidence:
  - data/raw/research/facts.csv
  - data/processed/w3techs_english.csv
  - data/processed/cc_english.csv
  notes: "Two-part claim: first half contradicted, second half supported for the open examples. 'More than half' is out of date: W3Techs has English at 49.5% of websites (Oct. 31, 2026), under 50% since Jan. 2025. Common Crawl's latest crawl (CC-MAIN-2026-43) is 42.6% English by pages. The second half holds: Meta reports (2023) that Llama 2 pretraining data is 89.7% English (the corpus itself was not released; only weights), and 51.3% of C4 pages are US-hosted. Most frontier labs do not publish data composition, so 'European and North American' rests on these open examples. 'Eurocentric view' is the speaker's interpretation."
  proposed_text: 'About half of websites are in English (49.5%, W3Techs), and Meta reports Llama 2''s training data was 90% English, so models carry a Western default.'
