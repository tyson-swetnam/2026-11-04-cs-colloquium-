- id: c2
  text: 'Figure: user request -> MCP context and RAG retrieval -> AI agent orchestrator -> iRODS data mesh and DuckLake data lake -> result'
  kind: technical
  priority: medium
  status: partially-supported
  validation: |
    The flow run over the real protocol (src/02_mcp_roundtrip.py): an MCP server (src/mesa_tools_server.py) exposes
    retrieval, a read-only DuckLake query, ontology and citation tools; the official MCP client discovers them and
    answers a plain-language question from the lake, and the server refuses a write, a wrong-concept term and a
    fabricated citation.
  sources:
  - https://modelcontextprotocol.io/
  - https://ducklake.select/
  evidence:
  - data/processed/mcp_transcript.json
  - data/processed/mcp_calls.csv
  notes: |
    Demonstrated: MCP tools, retrieval (keyword, not vector RAG), the DuckLake lake, the result path, and policy
    refusals. Not demonstrated here: a model as orchestrator (a scripted plan stands in; no model API in this
    environment) and the iRODS mesh (slides 15-16). Nuance for a CS audience: in the figure MCP is drawn as
    "context"; it is mainly the channel through which the orchestrator calls tools (the mesh and the lake).
