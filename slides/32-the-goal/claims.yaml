- id: c5
  text: 'Students: Spring 2026: CS 491/591: AI Automation and Agents'
  kind: factual
  priority: high
  status: unverified
  validation: 'UNM course schedule. Note: the talk is Nov. 2026, so a Spring 2026 offering is past; Spring 2027?'
  sources:
  - https://www.cs.unm.edu/programs-and-degrees/courses.html
  - https://carc.unm.edu/education/cse/electives/
  - https://schedule.unm.edu/assets/finals/spring-2026.pdf
  - https://schedule.unm.edu/
  evidence:
  - data/raw/research/facts.csv
  - data/processed/timing.csv
  notes: 'Not confirmed. I found no public page naming a UNM CS 491/591 section "AI Automation and Agents" in any term. CS 491/591 are special-topics numbers (F7). The CARC electives page (CARC''s own summary, offering status checked August 30, 2026, not the official Schedule of Classes) says Fall 2026 topics "include" four named topics; agents is not named in that list, but the list is introduced with "include" and may be partial, so it does not show that no agents section exists (F8). The UNM Schedule of Classes search (lobowebapp.unm.edu) failed TLS verification through the proxy and WebFetch got HTTP 503, and Coursicle returned 429, so I could not search the Spring 2026 or Spring 2027 schedules; I did not work around this. Nothing found confirms a Spring 2027 section either. Timing is certain: Spring 2026 finals ended May 16, 2026, 172 days before the talk (F9, timing.csv), so "Spring 2026" points students at a course that is over. The speaker should confirm the term and title in LoboWeb before naming a course; until then the proposed wording names no term or title.'
  proposed_text: 'CS 491/591 special topics (check LoboWeb for Spring 2027) · DUST 2026 lessons'
