# --- Facts the candidate lines rest on ---
- id: c5
  text: The five hyperscalers spent 95% of operating cash flow on capex in the 12 months to 2026Q3 (36-55% in 2019-2024)
  kind: quantitative
  priority: high
  status: supported
  validation: Trailing four fiscal quarters of actuals from SEC XBRL, summed across firms (src/01_financial.py); OCF and capex match Van Nieuwerburgh (2026) Figure 1 within 1% for 2020-2025 (src/04_validate.py).
  sources:
  - https://data.sec.gov/api/xbrl/companyfacts/
  - https://www.brookings.edu/wp-content/uploads/2026/09/4c_Van-Nieuwerburgh.pdf
  evidence:
  - data/processed/hyperscaler_ttm.csv
  - data/processed/hyperscaler_annual.csv
  - data/processed/validation.csv
  notes: Oracle (161%) and Amazon (128%) already spend more than they generate; Microsoft is at 69%.
- id: c6
  text: Their on-balance-sheet debt rose from $231B (FY2024 year ends) to $556B (latest filings)
  kind: quantitative
  priority: high
  status: supported
  validation: Total long-term debt (incl. current portion) from SEC XBRL per firm (src/01_financial.py).
  sources:
  - https://data.sec.gov/api/xbrl/companyfacts/
  evidence:
  - data/processed/hyperscaler_debt_change.csv
  - figures/fig2_debt.png
  notes: Microsoft's debt fell ($45B to $35B); Alphabet ($12B to $126B) and Amazon ($58B to $181B) drove the rise.
- id: c7
  text: More sits off the balance sheet (Meta's Hyperion ~90% debt-financed in a JV; ~$660B of future leases not yet recognized)
  kind: attribution
  priority: medium
  status: supported
  validation: Quoted from Van Nieuwerburgh (2026), Section IV, citing Moody's Ratings (2026a).
  sources:
  - https://www.brookings.edu/wp-content/uploads/2026/09/4c_Van-Nieuwerburgh.pdf
  evidence:
  - benchmarks.yaml
- id: c8
  text: US data centers used 192 TWh in 2024, 4.7% of US electricity; 9.5-15.3% projected for 2030
  kind: attribution
  priority: high
  status: supported
  validation: Quote checked in the downloaded LBNL report.
  sources:
  - https://www.osti.gov/servlets/purl/3374245
  evidence:
  - data/raw/environment/facts.csv
  notes: LBNL, United States Data Center Energy Usage Report 2025 Update (LBNL-2001758, June 2026). That is 6.3x New Mexico's total retail electricity sales (data/processed/environment_nm.csv).
- id: c9
  text: Project Jupiter (Doña Ana County) seeks an air permit for 2,462 MW of gas fuel cells, more than PNM's all-time peak of 2,264 MW
  kind: quantitative
  priority: high
  status: supported
  validation: Nameplate from NMED's hearing notice; PNM peak from the Albuquerque Journal quoting PNM; ratio computed in src/02_environment.py.
  sources:
  - https://www.env.nm.gov/opf/wp-content/uploads/sites/13/2026/07/2026-08-12-AQB-26-57-Amended-Notice-of-Hearing-English-filed.pdf
  - https://www.abqjournal.com/
  evidence:
  - data/processed/environment_nm.csv
  - figures/fig3_new_mexico.png
  notes: |
    Proposed, not permitted: the NMED public hearing starts Dec. 7, 2026. A revised application caps operation at
    1,600 MW (news report of the filing), which run all year would be up to 14 TWh, 46% of NM's 2024 retail sales.
    An Oct. 2025 estimate put demand at 700-900 MW. Check the news the day before the talk.
- id: c10
  text: US data centers consumed ~66 billion liters of water on site in 2023, and ~800 billion liters more through electricity generation
  kind: attribution
  priority: low
  status: partially-supported
  validation: From a DOE national-lab slide citing the LBNL 2024 report; the LBNL PDF itself was blocked.
  sources:
  - https://www.osti.gov/servlets/purl/17273330
  evidence:
  - data/raw/environment/facts.csv
  notes: Secondary citation; confirm against LBNL (2024) section 5 before using.
- id: c11
  text: Training on books was ruled fair use, but pirated copies were not; Bartz v. Anthropic settled for $1.5B (~$3,000 per work), final approval July 20, 2026
  kind: factual
  priority: medium
  status: supported
  validation: Court order (Dkt. 231), court-authorized notice, and the settlement website, quotes checked.
  sources:
  - https://storage.courtlistener.com/recap/gov.uscourts.cand.434709/gov.uscourts.cand.434709.231.0.pdf
  - https://www.anthropiccopyrightsettlement.com/
  evidence:
  - data/raw/training_misuse/facts.csv
  notes: Fair-use question for LLMs is still open on appeal; the 3d Cir. (Thomson Reuters v. ROSS, Sept. 2026) found a non-generative AI's use not fair.
- id: c12
  text: Developers report real misuse, e.g. a state-sponsored group ran 80-90% of an espionage campaign's tactical work with an AI agent (~30 targets)
  kind: attribution
  priority: medium
  status: supported
  validation: Developer's own report (Anthropic, Nov. 2025); not independently verified. OpenAI (Oct. 2025) and Google GTIG (May 2026) report comparable activity.
  sources:
  - https://assets.anthropic.com/m/ec212e6566a0d47/original/Disrupting-the-first-reported-AI-orchestrated-cyber-espionage-campaign.pdf
  evidence:
  - data/raw/training_misuse/facts.csv
- id: c13
  text: ICML 2026 caught 795 reviews (~1%) by reviewers who had pledged not to use LLMs; 497 papers were desk-rejected
  kind: factual
  priority: medium
  status: supported
  validation: ICML program chairs' blog; detection by hidden prompts in PDFs with human review, so a lower bound.
  sources:
  - https://blog.icml.cc/2026/03/18/on-violations-of-llm-review-policies/
  evidence:
  - data/raw/training_misuse/facts.csv
- id: c14
  text: 23.7% of The Pile is full-text research papers (PubMed Central, arXiv, PhilPapers); 27.1% with abstracts and grant text
  kind: quantitative
  priority: medium
  status: supported
  validation: Parsed from the paper's own LaTeX Table 1 (src/05_corpus_shares.py); totals reproduce the published 1,254.20 GiB.
  sources:
  - https://arxiv.org/abs/2101.00027
  evidence:
  - data/processed/corpus_shares.csv
  notes: BloombergGPT, whose weights were not released, trained on ~42B scholarly tokens (5.9%), parsed from its Table 2.
- id: c15
  text: Taylor & Francis ($75M+ in 2024) and Wiley (>$110M lifetime) have booked at least $185M from licensing content to AI firms
  kind: attribution
  priority: medium
  status: supported
  validation: Informa results filings (UK FCA NSM) and Wiley press releases, quotes checked at source.
  sources:
  - https://data.fca.org.uk/artefacts/NSM/RNS/5562936.html
  - https://newsroom.wiley.com/press-releases/press-release-details/2026/Research-and-AI-Momentum-Record-Margins-and-Cash-Flow-Growth-Highlight-Wileys-Fourth-Quarter-and-Fiscal-2026-Results/default.aspx
  evidence:
  - data/raw/closed_systems/facts.csv
  notes: Cambridge UP asked 40,000+ authors to opt in; Taylor & Francis authors reported not being told (The Bookseller, July 2024).
- id: c16
  text: Only 8% of researchers trust AI companies not to use their research data without permission
  kind: attribution
  priority: low
  status: supported
  validation: Oxford University Press survey (May 2024, 2,000+ researchers), quote checked in saved page.
  sources:
  - https://corp.oup.com/news/how-are-researchers-responding-to-ai/
  evidence:
  - data/raw/closed_systems/facts.csv
