slide: 15
title: 'Agents, tools, and the Model Context Protocol'
section: 02 · Science
claims:
- id: c1
  text: A language model answers from what it read in training. It cannot see your files or run your code.
  kind: technical
  priority: low
  status: supported
  validation: Definition of a bare model (no tools); see README.
  sources: []
  evidence:
  - README.md
  notes: True of the model itself; chat products that read files or run code do so through tools in a harness, which is the point of cards 2-3.
- id: c2
  text: 'An agent is a loop around the model: read the goal, call a tool, read the result, decide the next call.'
  kind: technical
  priority: low
  status: supported
  validation: The loop's tool side runs in slide 14's MCP demo (discover tools, call, read result, next call); a scripted plan stands in for the model.
  sources: []
  evidence:
  - ../14-agentic-ai/data/processed/mcp_transcript.json
- id: c3
  text: The harness owns the loop, the files it may touch and the permissions.
  kind: technical
  priority: low
  status: supported
  validation: Definition; slide 14's server shows permissions enforced outside the model (read-only lake, refused writes).
  sources: []
  evidence:
  - ../14-agentic-ai/data/processed/mcp_calls.csv
- id: c4
  text: MCP is the USB-C port for agents
  kind: attribution
  priority: low
  status: supported
  validation: Quoted from the MCP documentation (src/01_mcp_support.py).
  sources:
  - https://modelcontextprotocol.io/docs/getting-started/intro
  evidence:
  - data/processed/mcp_support.csv
  notes: 'The docs say "Think of MCP like a USB-C port for AI applications." Credit the analogy on the slide or aloud.'
- id: c5
  text: 'Notes: an MCP server is usable from every agent your group already uses (Claude Code, Codex, Antigravity, OpenCode, Goose)'
  kind: factual
  priority: medium
