slide: 15
title: 'Agents, tools, and the Model Context Protocol'
section: 02 · Science
claims:
- id: c1
  text: A language model answers from what it read in training. It cannot see your files or run your code.
  kind: technical
  priority: low
  status: supported
  validation: |
    Definition of a bare model (no tools). The MCP docs describe file and tool access as something an AI application
    gains by connecting to data sources and tools (facts.csv f26), i.e. it comes from the harness, not the model.
  sources:
  - https://modelcontextprotocol.io/docs/getting-started/intro
  evidence:
  - data/raw/research/facts.csv
  - data/raw/sources/MANIFEST.yaml
  notes: |
    True of the model itself; chat products that read files or run code do so through tools in a harness, which is
    the point of cards 2-3. Earlier the only evidence was this README (circular); now backed by the MCP docs (f26),
    which support the claim indirectly. A model also reads whatever is put in its prompt, so "answers from training"
    is the plain-language simplification, not the whole story.
- id: c2
  text: 'An agent is a loop around the model: read the goal, call a tool, read the result, decide the next call.'
  kind: technical
  priority: low
  status: supported
  validation: The loop's tool side runs in slide 14's MCP demo (discover tools, call, read result, next call); a scripted plan stands in for the model.
  sources: []
  evidence:
  - ../14-agentic-ai/data/processed/mcp_transcript.json
- id: c3
  text: The harness owns the loop, the files it may touch and the permissions.
  kind: technical
  priority: low
  status: supported
  validation: Definition; slide 14's server shows permissions enforced outside the model (read-only lake, refused writes).
  sources: []
  evidence:
  - ../14-agentic-ai/data/processed/mcp_calls.csv
- id: c4
  text: MCP is the USB-C port for agents
  kind: attribution
  priority: low
  status: supported
  validation: Quoted from the MCP documentation (src/01_mcp_support.py).
  sources:
  - https://modelcontextprotocol.io/docs/getting-started/intro
  evidence:
  - data/processed/mcp_support.csv
  notes: 'The docs say "Think of MCP like a USB-C port for AI applications." Credit the analogy on the slide or aloud.'
- id: c5
  text: 'Notes: an MCP server is usable from every agent your group already uses (Claude Code, Codex, Antigravity, OpenCode, Goose)'
  kind: factual
  priority: medium
  status: partially-supported
  validation: |
    Each client's own documentation states MCP support (src/01_mcp_support.py -> mcp_support.csv; quotes in facts.csv
    f14-f18, pages saved under data/raw/sources/client_*.html). MESA's docs show that a given server is not always
    usable from all five in practice (facts.csv f23-f25).
  sources:
  - https://code.claude.com/docs/en/mcp
  - https://developers.openai.com/codex/mcp
  - https://antigravity.google/docs/mcp
  - https://opencode.ai/docs/mcp-servers/
  - https://goose-docs.ai/
  - https://idss-mesa.github.io/docs/servers/formation-mcp/index.md
  - https://idss-mesa.github.io/docs/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/mcp_support.csv
  notes: |
    Supported: all five clients speak MCP. Not supported as a blanket statement: MESA's own docs say OpenCode and Goose
    cannot complete the hosted Formation server's sign-in in the MESA apps, Antigravity's sign-in "has not been tested
    by MESA", and OpenCode's irods is the hosted public endpoint that reads public data only (f23-f25). So "every server,
    every agent" overstates it; sign-in and transport can block a client.
    Goose's docs moved from block.github.io/goose to goose-docs.ai (redirect confirmed 2026-10-31).
    MESA's own installer registers its servers with four of the five (Claude Code, Codex CLI, Antigravity, OpenCode);
    Goose ships in the MESA CLI app but is not a documented installer target (f9-f10).
    Slide 14's mcp.json was dropped as evidence: it points to slides/10-agentic-ai/src/mesa_tools_server.py, which does
    not exist (the server is at slides/14-agentic-ai/src/mesa_tools_server.py). Slide 14's owner should fix that path.
  proposed_text: "Notes: Claude Code, Codex, Antigravity, OpenCode and Goose all speak MCP, so a server you stand up once can plug into each of them, though sign-in for hosted servers can still differ by client."
- id: c6
  text: "Notes: MESA's MCP servers are public today"
  kind: factual
  priority: medium
  status: partially-supported
  validation: |
    Checked from MESA's public docs only (src/02_mesa_public.py -> data/processed/mesa_public.csv), not its code
    or the GitHub repositories. The docs give a public one-line installer pulled from raw.githubusercontent.com/idss-mesa,
    say the installer clones the server repos from the idss-mesa GitHub org, link a repo for each server, and note a
    published Docker image (cyverse/irods-mcp-server). Default data access is anonymous with no credentials.
  sources:
  - https://idss-mesa.github.io/docs/index.md
  - https://idss-mesa.github.io/docs/install/index.md
  - https://idss-mesa.github.io/docs/servers/mesa-mcp/index.md
  - https://idss-mesa.github.io/docs/servers/irods-mcp-server/index.md
  - https://idss-mesa.github.io/docs/servers/formation-mcp/index.md
  evidence:
  - data/raw/research/facts.csv
  - data/processed/mesa_public.csv
  notes: |
    "Public" here means anyone can install and run MESA's own servers (mesa-mcp and irods-mcp-server, both linked as
    idss-mesa repos) locally, and their default data access is anonymous and read-only. It does not mean every endpoint
    is open: the hosted mesa-mcp "requires authentication" and the installer builds mesa-mcp and irods locally "because
    they work without signing in" (f21-f22). The third registered server, Formation, is CyVerse's hosted Discovery
    Environment server, run by CyVerse, with source in cyverse-de/formation, and needs a CyVerse sign-in (f7, f20).
    Correction: an earlier note called irods-mcp-server CyVerse's; MESA's docs give its repo as idss-mesa/irods-mcp-server
    (f19). Only its Docker image is under cyverse/ (f6), and it targets CyVerse's Data Store. The docs strongly imply the
    idss-mesa repos are public (an anonymous installer clones them), but repository visibility and licence were not
    checked directly, and no licence is named on the server or install pages. If saying "open source", confirm the
    licence in the repos first.
  proposed_text: "MESA's own MCP servers are public today: one install command, source on GitHub (idss-mesa), and they run locally without signing in."
- id: c7
  text: 'Card 4: describe a server once, and any agent that speaks MCP can use it'
  kind: technical
  priority: low
  status: supported
  validation: |
    The MCP docs say MCP is supported across many clients, "making it easy to build once and integrate everywhere"
    (re-fetched 2026-10-31); c5 confirms MCP support in the five named clients.
  sources:
  - https://modelcontextprotocol.io/docs/getting-started/intro
  evidence:
  - data/raw/research/facts.csv
  - data/processed/mcp_support.csv
  notes: |
    Build once is accurate as a statement about the protocol; each client still needs its own registration entry
    (config formats differ), which is what MESA's installer automates. "Any agent" holds for the server's protocol
    surface, but sign-in can still block a client: MESA's docs say OpenCode and Goose cannot complete Formation's
    sign-in in the MESA apps (f23). Slide 14's mcp.json was dropped as evidence because it points to a script path
    that does not exist (slides/10-agentic-ai/...; the server is under slides/14-agentic-ai/src/).
