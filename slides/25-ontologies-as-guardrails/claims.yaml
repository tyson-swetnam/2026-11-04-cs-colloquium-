- id: c8
  text: 'mm / millimeters / millim. -> UO:0000016 (millimetre); mm² / sq mm / mm2 -> UO:0000082 (square millimetre)'
  kind: factual
  priority: high
  status: partially-supported
  validation: 'Resolve through OLS4.'
  sources:
  - https://www.ebi.ac.uk/ols4/api/ontologies/uo/terms?obo_id=UO:0000016
  - https://www.ebi.ac.uk/ols4/api/ontologies/uo/terms?obo_id=UO:0000082
  evidence:
  - data/processed/terms.csv
  - data/processed/variants.csv
  - data/raw/research/facts.csv
  - ../17-hallucination-is-engineering/data/processed/ontology_writes.csv
  notes: >-
    Rechecked 2026-10-31; corrects the earlier note. Both CURIEs are current. UO's labels are 'millimeter' and
    'square millimeter', but 'millimetre' and 'square millimetre' are listed synonyms, so the slide's spelling is
    fine. 'mm' and 'millimeters' resolve, 'millim.' does not. 'mm2' and 'mm²' match the synonym 'mm^[2]' only
    after normalisation (Unicode NFKD, punctuation stripped); 'sq mm' does not resolve.
- id: c9
  text: 'OWL carries the class hierarchy, so a question about beetles (Coleoptera) finds every carabid'
  kind: technical
  priority: medium
  status: supported
  validation: 'Coleoptera (NCBITaxon:7041) among the ancestors of NCBITaxon:41073.'
  sources:
  - https://www.ebi.ac.uk/ols4/
  evidence:
  - data/processed/hierarchy.csv
  - data/raw/research/facts.csv
  - ../17-hallucination-is-engineering/data/processed/ontology_hierarchy.csv
  notes: >-
    Rechecked 2026-10-31: Coleoptera (NCBITaxon:7041, rank order, synonym "beetles") is among the OLS
    hierarchical ancestors of Carabidae (NCBITaxon:41073, rank family). The hierarchy makes the query possible;
    whether MESA's query layer expands subclasses is c13.
- id: c10
  text: 'Terms resolve through the Ontology Lookup Service (OLS) and the OBO Foundry'
  kind: factual
  priority: medium
  status: supported
  validation: 'OLS4 returns all four CURIEs; the three ontologies are in the OBO Foundry registry; MESA docs name OBO/OLS.'
  sources:
  - https://www.ebi.ac.uk/ols4/
  - https://obofoundry.org/registry/ontologies.jsonld
  - https://idss-mesa.github.io/docs/servers/mesa-mcp/
  evidence:
  - data/processed/terms.csv
  - data/processed/obo_foundry.csv
  - data/raw/research/facts.csv
  notes: >-
    All four CURIEs resolve in OLS4. NCBITaxon, OBI and UO are all active OBO Foundry ontologies, and the term
    IRIs are purl.obolibrary.org PURLs. mesa-mcp's (developer-written) docs say its mesa_ols_* tools browse
    OBO/OLS ontologies. Strictly, OLS does the lookup; the OBO Foundry is the registry and PURL resolver.
