- id: c4
  text: A term that will not resolve fails the write
  kind: technical
  priority: medium
  status: unverified
  validation: 'Public MESA docs (idss-mesa.github.io, mesa-anyjev docs); the write path itself is only in code.'
  sources:
  - https://idss-mesa.github.io/docs/servers/mesa-mcp/
  - https://idss-mesa.github.io/mesa-anyjev/
  - https://idss-mesa.github.io/mesa-anyjev/concepts/mcp-tools/
  evidence:
  - data/raw/research/facts.csv
  notes: >-
    Left unverified: the behaviour lives in MESA code, which was out of scope. The public, developer-written docs
    say mesa-mcp stores the ontology CURIE in the AVU unit slot, that mesa-anyjev draws candidate terms from an
    OLS search with a prefix filter, that a curator's pick is authoritative and that a decline leaves the group
    unwritten (facts f15-f18). None of them says that a term failing to resolve is refused at write time. The
    repo's own re-implementation of the check (evidence/ontology.py, slide 17) does refuse invented, obsolete
    and wrong-ontology CURIEs, but that is this talk's validator, not MESA's write path.
  proposed_text: 'Candidate terms come only from an OLS search, and a curator approves the pick.'
