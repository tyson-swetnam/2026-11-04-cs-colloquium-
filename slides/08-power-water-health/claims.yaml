slide: 8
title: 'Power, water and public health'
section: '01 · Fear'
claims:
- id: c1
  text: 'Global data-center power use projected to more than double by 2030, roughly 3% of total electricity, equal to Japan; 945 TWh by 2030'
  kind: quantitative
  priority: high
  status: supported
  validation: 'IEA, Energy and AI (2025) primary figures.'
  sources:
  - https://www.hydrocarbonengineering.com/the-environment/10042025/iea-ai-set-to-drive-surging-electricity-demand/
  - https://brusselstimes.com/1528980/data-centres-will-double-global-electricity-demand-by-2030-iea
  - https://sustainabilityonline.net/news/data-centres-to-account-for-3-of-global-electricity-consumption-by-2030/
  - https://iifiir.org/en/news/ai-set-to-drive-doubling-of-electricity-demand-from-data-centres
  - https://www.iea.org/reports/energy-and-ai/executive-summary
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  - data/processed/computed.csv
  notes: |
    All parts check out against the IEA press release of 10 April 2025, read as a verbatim reprint (F01, F02):
    "more than double by 2030 to around 945 TWh, slightly more than the entire electricity consumption of Japan
    today". The 2024 base is 415 TWh (1.5%), so 945/415 = 2.28x (computed.csv). Two news reports of the
    report give "just under 3%" / "nearly 3%" for 2030 (F03, F04). iea.org itself returned a 403 Cloudflare
    challenge to our User-Agent, so the IEA page was not read directly; the figures are consistent across all
    copies. 945 TWh is the IEA Base Case, one of several scenarios. "Equal to Japan" should be "about as much
    as Japan uses today": the comparison is with Japan's current use, not Japan in 2030.
  proposed_text: 'Global data-center electricity use is projected to more than double by 2030, to just under 3% of the world total, about what Japan uses today (IEA, 2025).'
- id: c2
  text: 'xAI ran up to 35 unpermitted gas turbines at Colossus 1; 27 unpermitted power Colossus 2; up to 1,700+ tons of NOx a year'
  kind: quantitative
  priority: high
  status: partially-supported
  validation: 'SELC and Earthjustice filings; permit records; NAACP v. xAI docket.'
  sources:
  - https://www.selc.org/news/xai-built-an-illegal-power-plant-to-power-its-data-center/
  - https://earthjustice.org/wp-content/uploads/2026/10/10313375508_6407.pdf
  - https://www.selc.org/press-release/court-tosses-request-to-block-clean-air-act-lawsuit-against-musks-xai/
  - https://www.selc.org/press-release/groups-threaten-lawsuit-over-xais-unpermitted-gas-turbines-in-mississippi/
  - https://www.selc.org/press-releases/mississippi-regulators-rubber-stamp-air-permit-for-xai-power-plant-ignoring-overwhelming-public-pushback/
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  - data/processed/computed.csv
  notes: |
    "As many as 35" at Colossus 1 is SELC's account (F06). The complaint says there were "at least twenty-seven"
    turbines at Southaven as of April 7, 2026, which "have the potential to emit per year approximately 1,700 tons"
    of NOx. The court's Oct. 30, 2026 order recites this (F08, F33, F09). The unit mix in footnote 4 sums to 27
    units and 495 MW (computed.csv). These are the plaintiffs' allegations, accepted as true only for the motion to
    dismiss; they are not findings. The figure is a potential to emit, not measured emissions, and the complaint
    says "approximately", not "more than". "More than 1,700 tons" is the wording of SELC's and Earthjustice's own
    pages (F35), so the slide's "1,700+" follows counsel's advocacy, not the complaint.
    Current fleet size: SELC's Oct. 30, 2026 release speaks of "dozens of unpermitted gas turbines" and a potential
    of "more than 5,000 tons" of NOx a year (F11), but gives no count. SELC already called the 27-turbine fleet
    "dozens" in April 2026 (F34), so "dozens" is not evidence of growth. The higher emission figures may reflect
    more turbines or a different basis; we cannot tell. Press reports of 46 to 59 turbines were not checked against
    a primary source. (Correction 2026-10-31: an earlier note said the fleet "has grown beyond 27"; that was not
    supported.) "Still unpermitted" holds: the March 2026 MDEQ permit covers a different 41-turbine plant, and the
    complaint says none of the running turbines fall under it (F10, F32).
  proposed_text: 'xAI ran up to 35 unpermitted gas turbines at Colossus 1 in Memphis. Colossus 2 is powered by unpermitted turbines in Mississippi: the April 2026 suit names 27 and alleges they could emit about 1,700 tons of smog-forming NOx a year.'
- id: c3
  text: 'Colossus cooling draws on the Memphis Sand Aquifer; up to 3.7 million gallons a day requested; recycling plant stalled April 2026'
  kind: quantitative
  priority: medium
  status: supported
  validation: 'MLGW statements; Memphis Flyer; Politico.'
  sources:
  - https://www.eenews.net/articles/xai-sidelines-major-water-reuse-project-as-ipo-looms/
  - https://www.thecooldown.com/green-tech/musk-ai-water-recycling-project-memphis/
  - https://www.wwdmag.com/wastewater-treatment/news/55386236/xai-commits-to-restarting-memphis-wastewater-recycling-project-in-2027
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  notes: |
    E&E News (Politico), May 4, 2026: "requested to use up to 3.7 million gallons of water a day, both at its
    original data center and second site ... MLGW said" (F17). It also says "Work abruptly stopped at the facility in
    April" and calls the aquifer "the sole source of Memphis drinking water" (F18, F19). The Cool Down repeats this
    (F20). The 3.7 MGD figure is a request reported by MLGW, not measured use, and no MLGW document was found.
    Since the slide was written: on June 24, 2026 Wastewater Digest reported that xAI had committed to restart
    construction by Q1 2027, according to Mayor Paul Young (F21). "Stalled" is accurate, but the slide should
    mention the restart promise.
  proposed_text: 'Cooling draws on the Memphis Sand Aquifer, the city’s drinking water; xAI has asked for up to 3.7 million gallons a day. Its promised recycling plant stalled in April 2026; xAI now says it will restart in early 2027.'
- id: c4
  text: 'Notes: ~1,300 premature deaths a year by 2030, ~600,000 asthma cases, ~$20B a year in health costs (UC Riverside & Caltech, The Unpaid Toll, 2024)'
  kind: attribution
  priority: medium
  status: partially-supported
  validation: 'Read the paper (arXiv preprint) for the exact figures and scenario.'
  sources:
  - https://arxiv.org/abs/2412.06288
  - https://arxiv.org/pdf/2412.06288v1
  - https://arxiv.org/pdf/2412.06288
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  notes: |
    The figures match preprint v1 (Dec. 9, 2024, "The Unpaid Toll: Quantifying the Public Health Impact of AI"):
    about 600,000 asthma symptom cases and 1,300 premature deaths in 2030 (F24). In v1 these are already scenario
    projections: McKinsey's medium-growth projection of data-center demand (F38), with the cost "valued at up to
    more than $20 billion per year" (F37). The latest version is v4 (June 8, 2026). It is retitled
    "Health-Informed Computing: Estimating and Addressing the Public Health Impact of Data Centers" and gives the
    same numbers for 2028 under its high-growth scenario, with costs "up to more than $20 billion" (F25, F26, F39,
    F40). So the change between versions is the target year and the named scenario; both versions are
    scenario-conditional, and "projected to cause" needs a scenario caveat whichever version is cited. v4's body
    says "1,300 premature deaths" (F39); its abstract says "1,300 deaths" (F25). It is still a preprint, not
    peer-reviewed. Wording fixes: the cost is "up to more than $20B", not "close to $20B"; the "asthma cases" are
    asthma symptom cases; the year depends on the version cited. v4 also lists an RIT author alongside UC
    Riverside and Caltech.
  proposed_text: 'In a high-growth scenario, air pollution from the power behind US data centers could cause about 1,300 premature deaths and 600,000 asthma symptom cases in 2028, with health costs of up to more than $20B (Han et al., UC Riverside & Caltech, arXiv preprint, rev. 2026).'
- id: c5
  text: 'Jevons (The Coal Question, 1865): more efficient steam engines made Britain burn more coal'
  kind: factual
  priority: low
  status: supported
  validation: 'Primary text.'
  sources:
  - https://www.econlib.org/library/YPDBooks/Jevons/jvnCQ.html?chapter_num=9
  - https://www.econlib.org/library/YPDBooks/Jevons/jvnCQ.html
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  notes: |
    Chapter VII, "Of the Economy of Fuel": "It is wholly a confusion of ideas to suppose that the economical use
    of fuel is equivalent to a diminished consumption. The very contrary is the truth." (F27). Jevons calls Watt's
    condenser and expansive working "two modes of economising heat" (F28) and ties coal economy to growth in
    industry (F29). This is Jevons's argument, not a measured result. The text read is the 1866 2nd edition; the book
    was first published in 1865 (F30). On the slide, the link to "945 TWh by 2030" is the speaker's analogy: the
    IEA does not describe its projection as a Jevons effect.
    The slide line "Cheaper AI does the same: data centers reach 945 TWh by 2030" states the IEA Base Case
    projection as a fact ("is set to more than double by 2030 to around 945 TWh", F01; see c1). The Jevons part of
    the claim is supported; the 945 TWh half should be worded as a projection and the Jevons link as the speaker's
    reading.
  proposed_text: 'In 1865, Jevons saw that Watt’s more efficient steam engines made Britain burn more coal, not less. AI may be doing the same: the IEA projects data centers will use about 945 TWh by 2030.'
- id: c6
  text: 'Notes: Colossus 2 is powered by 27 unpermitted turbines (up to 495 MW) in Southaven, Mississippi, half a mile from homes and a mile from an elementary school; potential emissions >1,700 t NOx, up to 180 t fine particulates and 19 t formaldehyde a year'
  kind: quantitative
  priority: medium
  status: partially-supported
  validation: 'Court order reciting the complaint; Earthjustice case page; SELC releases.'
  sources:
  - https://earthjustice.org/wp-content/uploads/2026/10/10313375508_6407.pdf
  - https://earthjustice.org/case/xai-illegal-gas-power-plant-data-center-colossus
  - https://www.selc.org/press-release/court-tosses-request-to-block-clean-air-act-lawsuit-against-musks-xai/
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  - data/processed/computed.csv
  notes: |
    Each figure matches the complaint as the court recites it: at least 27 turbines and at least 495 MW (F08;
    the unit mix sums to 495 MW in computed.csv), and a potential to emit "approximately" 1,700 t NOx, 180 t PM2.5
    and 19 t formaldehyde a year (F33, F09). The notes' "more than 1,700 tons" and "up to 180 tons" are the
    wording of Earthjustice and SELC (F35), not of the complaint, and all of these are potentials to emit, not
    measured emissions. The distances come from Earthjustice (F12). All of these are allegations by the
    plaintiffs and their counsel, describing the plant as of April 2026. SELC's Oct. 30 release cites more than
    5,000 t NOx, 400 t PM and 47 t formaldehyde a year (F11) and "dozens" of turbines, but no count; SELC used
    "dozens" for the 27-turbine fleet in April too (F34), so a change in turbine numbers is not shown.
  proposed_text: 'Colossus 2 is powered by unpermitted turbines just over the state line in Southaven, Mississippi: at least 27 (495 MW) when the NAACP sued in April 2026. The complaint alleges they could emit about 1,700 t NOx, 180 t fine particulates and 19 t formaldehyde a year. SELC’s October 2026 estimates are higher.'
- id: c7
  text: 'Notes: The NAACP, represented by SELC and Earthjustice, sued under the Clean Air Act; on Oct. 30, 2026 the court denied xAI’s motion to dismiss'
  kind: factual
  priority: medium
  status: supported
  validation: 'Court order (N.D. Miss., No. 3:26-cv-74, Doc. 139).'
  sources:
  - https://earthjustice.org/wp-content/uploads/2026/10/10313375508_6407.pdf
  - https://www.selc.org/press-release/court-tosses-request-to-block-clean-air-act-lawsuit-against-musks-xai/
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  notes: |
    Opinion and Order, NAACP v. X.AI Corp. and MZX Tech LLC, No. 3:26-cv-74-DMB-JMV (N.D. Miss.), Doc. 139,
    signed by Judge Debra M. Brown on Oct. 30, 2026: "the defendants' motion to dismiss [54] is DENIED" (F13).
    The court held that the turbines are not "mobile sources" under Mississippi's SIP (F14). The complaint was filed
    on April 14, 2026, and the NAACP is represented by SELC and Earthjustice (F15). This is a ruling on a motion to
    dismiss, not on liability. SELC says the ruling "comes shortly after the Court denied a similar motion from the
    U.S. Department of Justice" (F36); SELC gives no date and the DOJ ruling was not fetched. SELC also says the
    preliminary injunction is still pending.
