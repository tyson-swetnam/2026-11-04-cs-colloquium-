- id: c10
  text: 'Notes: a wastewater recycling plant at the T.E. Maxson treatment plant was permitted in January 2026 to save up to 13 million gallons a day of aquifer water, and paused construction in April 2026'
  kind: quantitative
  priority: low
  status: partially-supported
  validation: 'TDEC permit as reported by the Memphis Flyer.'
  sources:
  - https://www.memphisflyer.com/state-issues-operating-permit-for-colossus-water-plant/
  - https://www.eenews.net/articles/xai-sidelines-major-water-reuse-project-as-ipo-looms/
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  notes: |
    Memphis Flyer, Jan. 28, 2026: TDEC issued an operating permit to CTC Property LLC that "will preserve use of up
    to 13 million gallons of aquifer water per day" (F22). The plant treats wastewater from the T.E. Maxson sewage
    treatment plant (F23); it is not described as sited at Maxson, so "at the T.E. Maxson treatment plant" is
    wrong and the claim is partially supported. The April 2026 pause is supported by E&E News (F18, see c3). The
    TDEC permit document itself was not fetched. As of June 2026, restart is promised by Q1 2027 (F21).
  proposed_text: 'A recycling plant to treat T.E. Maxson wastewater, permitted by the state in January 2026 to spare up to 13 million gallons a day of aquifer water, paused construction in April 2026; xAI now promises a restart by early 2027.'
