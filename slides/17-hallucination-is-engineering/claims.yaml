slide: 17
title: 'Hallucination is an engineering problem'
section: 01 · Fear
claims:
- id: c1
  text: “It invents citations” → the agent must call a real index
  kind: technical
  priority: medium
  status: supported
  validation: |
    One checker (evidence/citations.py: DOI registry + arXiv, by identifier or title, requiring at
    least half the cited authors on the record) run over 100 hallucinated citations GPTZero verified
    in accepted NeurIPS 2025 papers and over the 141 real references of BloombergGPT (src/01_citations.py).
  sources:
  - https://gptzero.me/news/neurips/
  - https://arxiv.org/abs/2303.17564
  evidence:
  - data/processed/citations_summary.csv
  - data/processed/citations_hallucinated.csv
  - data/processed/citations_real.csv
  - figures/fig1_citation_check.png
  notes: |
    Hallucinated: 99 of 100 flagged (29 with a definite reason: identifier points elsewhere,
    identifier unregistered, or wrong authors; 70 not found). Real: 108 of 141 (77%) verified
    automatically, 2 false mismatches from metadata changes (a retitled bioRxiv preprint, a truncated
    registry title), 31 (22%) not found, mostly pre-arXiv work, reports and workshop papers without DOIs.
    The control does not need a perfect index: it confirms most real references, never confirmed a
    fabricated identifier, and sends the rest to a person. Crossref, OpenAlex, Semantic Scholar and DBLP
    would shrink the review queue but were rate-limited or bot-gated from this environment.
- id: c2
  text: “It makes up metadata” → terms must resolve in an ontology
  kind: technical
  priority: medium
  status: supported
  validation: |
    The write path (evidence/ontology.py, src/02_ontology.py), run on slide 25's NEON beetle terms: all four
    model-style errors refused (wrong concept, invented CURIE, wrong field, obsolete term); of slide 25's 12
    free-text variants, 6 are names of the proposed term and are written, 6 are mappings sent to review.
  sources:
  - https://www.ebi.ac.uk/ols4/
  evidence:
  - data/processed/ontology_writes.csv
  notes: |
    'carabid', 'pinned beetle', 'voucher', 'sample', 'millim.', 'sq mm' are not names of the terms on slide 25:
    an agent proposes the mapping and the validator refuses it until a curator accepts it.
- id: c3
  text: “It varies run to run” → a JSON schema, validated in the agent
  kind: technical
  priority: medium
  status: revise-slide
  validation: |
    JSON Schema (draft 2020-12) for a dataset record, run against eight outputs
    (src/03_schema.py): six malformed outputs refused, the conforming one accepted.
  sources:
  - https://json-schema.org/draft/2020-12
  evidence:
  - data/processed/schema_checks.csv
  - data/processed/dataset_record.schema.json
  notes: |
    A schema fixes the shape of the output, not its content: a well-formed record with a fake DOI
    (taken from GPTZero's NeurIPS list) passed the schema and is caught only by control 1. Run-to-run
    variation in content was not measured (no model API in this environment).
  proposed_text: “It varies run to run” → a JSON schema fixes the shape; controls 1-2 check the content
- id: c4
  text: “I cannot audit it” → provenance in DuckLake; replay any run
  kind: technical
  priority: medium
  status: supported
  validation: |
    An agent session logged to a DuckLake catalog (src/04_provenance.py): after the written record
    is overwritten, time travel to the write snapshot recovers the original, and every logged tool
    call re-executed from its logged inputs reproduces its output hash.
  sources:
  - https://ducklake.select/
  evidence:
  - data/processed/provenance_snapshots.csv
  - data/processed/provenance_replay.csv
  notes: |
    "Replay" re-executes the tool calls and re-reads the data as of a snapshot; it cannot re-draw the
    model's samples, which are logged instead. That is enough for an audit.
- id: c5
  text: Google DeepMind's GNoME proposed 380,000 crystals; independent labs confirmed under 5%
  kind: attribution
  priority: high
  status: superseded
  superseded_note: "GNoME example and 'every output is a hypothesis' were removed from the slide in the revised deck."
  validation: |
    The paper's own numbers from its open-access full text, and the published critique's metadata
    from the DOI registry (src/05_gnome.py).
  sources:
  - https://doi.org/10.1038/s41586-023-06735-9
  - https://doi.org/10.1021/acs.chemmater.4c00643
  evidence:
  - data/processed/gnome_check.csv
  notes: |
    The paper: 381,000 new stable crystals (verified by DFT), of which 736 (0.19%) "have already been
    independently experimentally realized". That is not a confirmation rate: labs did not test the
    other 99.8% and fail; they have not been tried. The published critique (Cheetham & Seshadri,
    Chem. Mater. 36, 3490, 2024) is about novelty and usefulness, finding "scant evidence for compounds
    that fulfill the trifecta of novelty, credibility, and utility" (as quoted by The Register).
  proposed_text: Google DeepMind's GNoME predicted 381,000 new stable crystals; 736 (0.2%) had been made in a lab, and critics found few that were both new and useful.
