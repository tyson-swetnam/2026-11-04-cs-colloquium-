- id: c5
  text: 'Notes: every layer is swappable and open'
  kind: factual
  priority: medium
  status: partially-supported
  validation: Each layer shows more than one option, and each option is open.
  sources:
  - talk/deck.html#28
  - https://idss-mesa.github.io/stack.html
  - https://www.vastdata.com/legal/end-user-services-and-license-agreement
  - https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html
  evidence:
  - data/processed/licences.csv
  - data/processed/deck_slide28.json
  - data/raw/research/facts.csv
  notes: >-
    New claim from the speaker note. Swappable is fair as a design statement: every layer in the figure
    except agentic AI lists two or more alternatives, and MESA's installer supports four agent clients
    (f10, developer-reported). "Open" fails for the same reason as c1: AWS S3 and VAST are proprietary
    (f04-f06), Claude Code is not open source (f08), and compute is facilities rather than software, so
    "each layer has an open-source choice" would also be wrong. "Swappable" is design intent: it rests on
    the figure listing alternatives plus MESA's developer-reported installer for four agent clients (f10),
    which is about agent clients only; no source shows swapping compute or storage backends. The figure
    lists no alternatives in the agentic AI layer.
  proposed_text: 'Note: each layer is designed to be swappable, with open-source software at the core where it exists.'
