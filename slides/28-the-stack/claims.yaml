slide: 28
title: 'Five layers, all open source'
section: 03 · Build your AI
claims:
- id: c1
  text: Five layers, all open source
  kind: factual
  priority: medium
  status: contradicted
  validation: List each component per layer with its license (pulled from the GitHub API or SPDX headers).
  sources:
  - talk/deck.html#28
  - https://api.deps.dev/v3/projects/
  - https://ducklake.select/
  - https://irods.org/license/
  - https://www.lustre.org/
  - https://www.vastdata.com/legal/end-user-services-and-license-agreement
  - https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html
  - https://www.openstoragenetwork.org/
  - https://code.claude.com/docs/en/legal-and-compliance
  - https://idss-mesa.github.io/stack.html
  - https://idss-mesa.github.io/docs/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/licences.csv
  - data/processed/deck_slide28.json
  - data/processed/quote_check.csv
  - src/01_fetch_sources.py
  - src/02_licences_and_checks.py
  notes: >-
    The figure (extracted from the deck) has five layers: user interface (laptop/desktop, K8s container),
    agentic AI (no product named), data management (DuckLake, S3 API, iRODS, K8s CSI), compute (CyVerse,
    TACC, ACCESS-CI, NAIRR) and object storage (OSN, AWS S3, VAST, Lustre). Five layers is right. "All open
    source" is not: VAST is commercial software under an EULA that forbids deriving its source code (f04,
    f05), and AWS S3 is a commercial cloud service whose API is Amazon's (f06). The software pieces MESA
    builds on are open source: Kubernetes and CSI (Apache-2.0), DuckLake (MIT, f01), iRODS (BSD-3, f02),
    Lustre (open source, f03). The compute layer and OSN are facilities and programs, so "open source" does
    not apply to them. The agentic AI layer names no product; of MESA's four supported clients (f10), Codex
    CLI (Apache-2.0) and OpenCode (MIT, f09) are open source, Claude Code is under Anthropic's terms (f08),
    and Antigravity was not checked. MESA's own servers have a LICENSE file (f11) but the public docs do not
    name the licence; the code was out of scope, so that part stays unverified. Licences for software come
    from the deps.dev project API (data/processed/licences.csv). Reviewer follow-up (2026-10-31): an
    earlier suggestion ("open standards: each layer has an open-source option") was withdrawn. The only S3
    entry is Amazon's API, not an open standard (f06), compute is facilities and programs with no
    open-source option, and the agentic AI layer names no product.
  proposed_text: 'Five layers, built on open-source software where it exists'
- id: c2
  text: Running today on CyVerse, TACC, ACCESS-CI and NAIRR resources
  kind: factual
  priority: medium
  status: partially-supported
  validation: One deployment link per site.
  sources:
  - https://idss-mesa.github.io/stack.html
  - https://idss-mesa.github.io/docs/llms-full.txt
  - https://api.nsf.gov/services/v1/awards/2632685.json
  - https://mesa.cyverse.org/
  evidence:
  - data/raw/research/facts.csv
  - data/processed/site_mentions.csv
  - data/processed/endpoints.csv
  - data/processed/nsf_award_2632685.json
  - src/02_licences_and_checks.py
  notes: >-
    CyVerse is supported: MESA's public pages say Formation and the public Data Store connector are hosted
    by CyVerse (f13, f14; developer-reported), and on 2026-10-31 mesa.cyverse.org returned HTTP 200 while the
    two MCP endpoints answered 400/401 (up, but need an MCP client or sign-in). No public deployment link was
    found for TACC, ACCESS-CI (e.g. Jetstream2) or NAIRR: MESA's stack page and full docs mention none of
    them (0 mentions each, site_mentions.csv). The NSF abstract says MESA "will operate" on TACC, OSN, CyVerse
    and Jetstream-2 through ACCESS-CI (f12), and the award (funded under the NAIRR program, started
    2026-07-15) is funding, not a NAIRR compute allocation. Web search found no NAIRR Pilot project for MESA.
    If deployments at TACC or on ACCESS/NAIRR allocations exist, they are not public; the speaker should
    confirm or reword. Scope caveat: per MESA's own page (f10, developer-reported), the installer clones,
    builds and registers the MESA servers on the user's machine and connects them to CyVerse's hosted
    Formation server; so the evidence shows MESA using CyVerse-hosted services (Formation, public Data
    Store), not the whole MESA stack deployed on CyVerse. HTTP 200 from mesa.cyverse.org only shows the site
    is up. NAIRR appears only as the award's fund program (fundProgramName "NAIRR-Nat AI Research
    Resource", f16), not as a site, and ACCESS-CI is the route to TACC, OSN, CyVerse and Jetstream-2, not
    a peer site. The abstract gives no dates, so "next" is avoided. An earlier suggestion listing NAIRR as
    a planned resource was withdrawn after review.
  proposed_text: 'Running today on CyVerse services; planned on TACC, Jetstream2 and OSN through ACCESS-CI (NSF award 2632685).'
