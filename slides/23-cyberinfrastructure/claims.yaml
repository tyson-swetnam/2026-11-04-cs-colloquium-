- id: c5
  text: 'Private inference: ACCESS-CI Jetstream2, NRP and NIS for self-hosted inference, model training and science gateways'
  kind: factual
  priority: medium
  status: partially-supported
  validation: 'Resource documentation.'
  sources:
  - https://docs.jetstream-cloud.org/overview/overview-doc/
  - https://docs.jetstream-cloud.org/inference-service/overview/
  - https://docs.jetstream-cloud.org/general/vmsizes/
  - https://nrp.ai/documentation/userdocs/ai/llm-managed/
  - https://cider.access-ci.org/public/resources/RDR_003540
  - https://docs.jetstream-cloud.org/general/running-llm/
  - https://nrp.ai/about/
  evidence:
  - data/raw/research/facts.csv
  - data/processed/quote_check.csv
  notes: >-
    Inference and science gateways on Jetstream2 (JS2) and NRP are supported; model training only in part.
    Jetstream2 is an ACCESS-allocated cloud with GPU VMs (up to 80 GB
    GPU RAM) and is meant for, among other things, "the backend to science gateways" (f09, f10, f13); it also
    runs a free vLLM inference service for ACCESS users, with processing only at IU Bloomington (f14, f15).
    NRP (Nautilus) is in the ACCESS resource catalogue, hosts open-weight LLMs and supports running your own
    with vLLM or SGLang (f16, f17). Training: JS2's own LLM guide says pre-training "is likely too
    compute-intensive" for a typical allocation and that fine-tuning "is more achievable" (f25), and its
    overview calls JS2 "small scale processing on demand" (f13). NRP says it supports "advanced AI and machine
    learning tasks" on its GPU clusters (f26) but the page does not name model training. So say fine-tuning,
    not training in general. (The JS2 inference page mentions training only to say user prompts are not used
    for it.) "NIS" could not be identified: no ACCESS, NSF or NAIRR page found under
    that name. Ask the speaker what NIS means, or drop it. Note that the hosted JS2 and NRP LLM services are
    shared services, so "private" fits self-hosted VMs better than the hosted endpoints.
  proposed_text: 'ACCESS-CI Jetstream2 and NRP: self-hosted or hosted open-weight inference, small-scale fine-tuning, science gateways.'
- id: c6
  text: 'CARC: locally hosted, private, open-weight models'
  kind: factual
  priority: medium
  status: partially-supported
  validation: 'CARC documentation or service page.'
  sources:
  - https://carc.unm.edu/ai-research-resources/
  - https://idss-mesa.github.io/mesa-anyjev/getting-started/gateway/
  - https://carc.unm.edu/jobs/postdoc-agentic-ai/
  evidence:
  - data/raw/research/facts.csv
  - data/raw/sources/MANIFEST.yaml
  notes: >-
    CARC's own page (2026-10-13) says "CARC does not currently provide hosted AI, large language model (LLM),
    or agent services as a production service" (f18). MESA's developer docs describe a LiteLLM/vLLM gateway
    on CARC hosts, reachable only over an SSH tunnel (f19, status draft), and CARC has H100/L40S/A100 GPU
    clusters where users can run open-weight models themselves (f20). The gateway is developer-reported in a
    draft page and CARC's own page does not mention it, so treat it as in testing, not a running pilot.
    There is no campus service yet, and the slide should not imply one.
  proposed_text: 'CARC: private open-weight models on campus GPUs (MESA gateway in testing, developer-reported; not a campus service yet)'
- id: c7
  text: 'Co-scientists: agents that write hypotheses and tests, download and analyze data, and report results continuously'
  kind: technical
  priority: medium
  status: unverified
  validation: 'A run log or repository showing the loop.'
  sources:
  - https://idss-mesa.github.io/llms-full.txt
  - https://idss-mesa.github.io/docs/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  notes: >-
    No public MESA, CARC or CyVerse page describes a running agent loop that writes hypotheses and tests,
    pulls and analyses data, and reports continuously. MESA's public pages list agentic orchestration as a
    goal (Goal 3, f21) and the NSF abstract lists "agentic orchestration" as an objective. If a run exists, it
    would only be visible in code or logs we did not read. Frame it as a goal.
  proposed_text: 'Co-scientists (goal): agents that propose hypotheses, write the tests, fetch and analyse data, and report.'
