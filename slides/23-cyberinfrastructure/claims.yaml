- id: c9
  text: "Speaker note: 'all four are bookable now. CyVerse allocations, Jetstream2 through ACCESS-CI.'"
  kind: factual
  priority: medium
  status: contradicted
  validation: 'Check each of the four boxes for a public way to request access today.'
  sources:
  - talk/slides.md#slide-23
  - https://cyverse.org/data-store
  - https://docs.jetstream-cloud.org/alloc/overview/
  - https://idss-mesa.github.io/okf/concepts/mesa-sandbox.md
  - https://idss-mesa.github.io/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/deck_check.json
  notes: >-
    New claim from the speaker note. The four boxes are Data Store, Kubernetes AI sandboxes, Private
    inference and Co-scientists. Data Store (free Basic accounts and subscriptions, f03, f29) and Private
    inference via Jetstream2/NRP through ACCESS (f09, f17) can be requested now; CARC is only one line inside
    the Private inference box, so its lack of a production LLM service (f18) does not by itself sink that box.
    The Kubernetes sandboxes are untested on a cluster (f07) and co-scientists are a goal (f21), so "all four"
    is not true. The note's "CyVerse allocations" does not match CyVerse's wording (accounts and
    subscriptions, f29).
  proposed_text: 'Note: "Two of these you can book now: CyVerse storage (free account or subscription), and Jetstream2 or NRP through ACCESS-CI. The sandboxes and co-scientists are what MESA is building."'
