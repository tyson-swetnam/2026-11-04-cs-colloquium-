slide: 23
title: 'AI sandboxes and secure enclaves'
section: 03 · Build your AI
claims:
- id: c1
  text: Petabytes of iRODS collections on CyVerse; public collections read anonymously, with no credentials
  kind: technical
  priority: medium
  status: partially-supported
  validation: Script an anonymous read of a public collection (WebDAV at data.cyverse.org) and cite a current Data Store size.
  sources:
  - https://docs.cyverse.org/architecture/system-overview/
  - https://cyverse.org/data-store
  - https://unblockme.cyverse.org/
  - https://carc.unm.edu/jobs/postdoc-agentic-ai/
  - https://idss-mesa.github.io/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/anon_read.json
  - src/02_anon_read.py
  - data/processed/quote_check.csv
  notes: >-
    "Petabytes" and iRODS are supported, but three figures are in circulation: CyVerse docs say the Data
    Store "manages over 6 PB data via iRODS" (f01; the page gives no date for that figure, so it may not be
    current); the CARC postdoc job page and the MESA hiring page say 5.2 PB (f05, f28); the MESA home page
    says "five petabytes" (f27). Avoid a precise number on the slide, or cite one source and its date. Anonymous public access is documented (f02, f03).
    But our scripted anonymous read of data.cyverse.org/dav-anon was redirected (HTTP 307) to an IP-unblock
    page with a CAPTCHA, because CyVerse blocks crawler IPs (f04). We did not pass the CAPTCHA, so the read
    itself is not demonstrated. "No credentials" holds; "at all" overstates it while the IP block is in place.
  proposed_text: 'Petabytes of iRODS collections on CyVerse. Public collections need no account.'
- id: c2
  text: 'Kubernetes AI sandboxes: agents get only allowed tools; egress through a proxy, every call recorded'
  kind: technical
  priority: medium
  status: partially-supported
  validation: Point at the manifests and proxy configuration; show a captured egress log.
  sources:
  - https://idss-mesa.github.io/okf/concepts/mesa-sandbox.md
  evidence:
  - data/raw/research/facts.csv
  - data/raw/sources/MANIFEST.yaml
  notes: >-
    Developer-reported design only. The public MESA page for mesa-sandbox describes per-agent Kubernetes pods,
    each with its own egress policy, and an egress-proxy sidecar that injects short-lived credentials only for
    allow-listed hosts (f06, f08). The same page says, as of 2026-09-06, "the Kubernetes profiles are untested
    on a cluster" (f07). No public page says every egress call is logged, or that tool access is restricted
    per agent; those parts could only be checked in the mesa-sandbox code, which we did not read, so they stay
    unverified. Present it as in development, not as running.
  proposed_text: 'Kubernetes AI sandboxes (in development): each agent in its own pod; egress only to allow-listed hosts through a proxy.'
- id: c3
  text: 'Private inference: ACCESS-CI allocations, CPU and GPU VMs from IaC templates'
  kind: factual
  priority: low
  status: superseded
  validation: Link the IaC templates and the ACCESS allocation types that cover Jetstream2 GPU.
  sources:
  - https://docs.jetstream-cloud.org/alloc/overview/
  - https://docs.jetstream-cloud.org/general/vmsizes/
  - https://docs.cyverse.org/architecture/system-overview/
  - https://docs.jetstream-cloud.org/ui/cacao/overview/
  evidence:
  - data/raw/research/facts.csv
  notes: >-
    The revised slide no longer says "CPU and GPU VMs from IaC templates"; c5 replaces it. For the record the
    old wording was correct: Jetstream2 is reached through ACCESS allocations (f09), has CPU and GPU VM
    resources exchanged separately for ACCESS credits (f10, f11), and CyVerse's CACAO is an IaC layer with
    templates documented by Jetstream2 (f12).
