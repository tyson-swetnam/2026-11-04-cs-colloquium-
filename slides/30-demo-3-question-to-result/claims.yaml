slide: 30
title: 'From question to result'
section: 03 · Build your AI
claims:
- id: c1
  text: 'A researcher asks which ground beetle is most common at NEON’s Jornada site. The agent queries the neon-beetle-seg lakehouse, read-only, and answers with a ranked table: Tetragonoderus pallidus, 58%.'
  kind: technical
  priority: high
  status: partially-supported
  validation: 'The recording (2026-11-02) shows the question, the agent''s plan and DuckDB queries against the neon-beetle-seg DuckLake read-only over WebDAV, its data checks, and the answer with the ranked table. src/02_jorn_carabids.py re-derives the ranking from NEON''s own API, independently of the agent and the lake, but NEON''s data endpoints returned HTTP 403 "Access Denied" without an API token on 2026-11-02. It has not run; set NEON_TOKEN and run it before the talk.'
  sources:
  - https://github.com/tyson-swetnam/neon-beetle-seg
  - https://data.neonscience.org/data-products/DP1.10022.001
  evidence:
  - data/media/MANIFEST.yaml
  - data/media/neon_beetle_seg_demo_1.5x.webm
  - figures/poster.webp
  notes: >-
    Replaces the placeholder "[A researcher asks a question; the agent queries the lakehouse on NAIRR compute and
    returns a figure.]", following this claim's earlier advice. "Lakehouse" stays because the recording queries the
    neon-beetle-seg DuckLake. "NAIRR compute" is dropped: the run is in the Claude app on the speaker's computer
    ("This computer"), reading the CyVerse Data Store over WebDAV. "Figure" becomes "ranked table", which is what the
    agent returns. The agent's answer, as on screen: Tetragonoderus pallidus, 616 of 1,056 carabid individuals
    (58.3%) in 417 of 732 records, 2015-05-28 to 2025-09-10; the slide rounds to 58%. The agent also reports 80
    PROVISIONAL and 652 RELEASE-2026 records, and 92 records (130 individuals) not identified to species. The lake
    could not be read from here (data.cyverse.org/dav-anon redirects to a bot check, not bypassed). "Non-CS
    researcher" (old notes) is no longer claimed.
