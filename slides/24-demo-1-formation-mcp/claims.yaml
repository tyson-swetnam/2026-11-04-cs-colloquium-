- id: c9
  text: 'Subtitle, body and notes: agents connect to "the same MESA servers" / "MESA’s Formation and Data Store servers" / "the same two MESA MCP servers"'
  kind: factual
  priority: medium
  status: partially-supported
  validation: Checked against MESA's own docs (src/01_check.py).
  sources:
  - https://idss-mesa.github.io/docs/servers/formation-mcp/index.md
  - https://idss-mesa.github.io/docs/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/checks.csv
  notes: |
    Added after review (2026-10-31); c4 covers only the slide label. Formation is CyVerse's own server, run by CyVerse
    (f1, f2). MESA registers three servers, not two: mesa-mcp, irods and formation (f17). In the MESA apps Claude Code
    also registers CyVerse-hosted irods and irods-auth endpoints (f31). "Data Store MCP" is therefore a group of
    servers, some MESA's and some CyVerse-hosted. "The MCP servers MESA installs" is accurate.
  proposed_text: 'Subtitle: "Any agent, the same MCP servers". Body: "Four agents connect through MCP to CyVerse''s Formation server and the Data Store servers MESA installs..." Notes: "each connects to the same MCP servers MESA installs".'
