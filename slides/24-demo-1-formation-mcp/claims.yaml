- id: c7
  text: 'Notes: the Data Store MCP server works "under the policies from the defense-in-depth slide"'
  kind: technical
  priority: medium
  status: partially-supported
  validation: |
    Compared slide 22's notes (talk/slides.md#slide-22) with MESA's public docs on how the Demo 1 servers act
    (src/01_check.py). Public docs only; no MESA or CyVerse code or iRODS rule base was read.
  sources:
  - https://idss-mesa.github.io/docs/servers/formation-mcp/index.md
  - https://idss-mesa.github.io/docs/llms-full.txt
  evidence:
  - data/raw/research/facts.csv
  - data/processed/checks.csv
  - ../../talk/slides.md
  notes: |
    Added after review (2026-10-31). Partly true: every Data Store request is checked against iRODS permissions. But
    slide 22 says the agent "works under its own account with read-only rights" and that "deletes, overwrites and
    permission changes from an agent account are refused". MESA's docs describe the Demo 1 servers differently:
    Formation works "always as **you** and with your own permissions" and has write and delete tools (upload_file,
    set_metadata, delete_data, which moves items to trash) (f28, f29); after cyverse-login the local mesa and irods
    servers "act as **you**" (f30). So in Demo 1 the agent has the user's rights, not a read-only agent account. MESA's
    ds_* tools list "rules, policies" (f14), but no public doc says the agent-account policies from slide 22 are
    deployed on the CyVerse Data Store these servers use.
  proposed_text: 'Notes: the Data Store servers act as the signed-in researcher, with that person''s iRODS permissions. (Drop "under the policies from the defense-in-depth slide", or demo with a separate read-only agent account.)'
